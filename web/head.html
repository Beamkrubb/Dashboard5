<title>Thai Agri Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: sticky filter rail on top, tabbed panels below; each panel = KPI strip, then map | chart pairs.
   Single deliberate dark "Neon Night" look (STYLE_HANDOFF.md), so no light variant. */
:root {
  color-scheme: dark;
  --bg: #0F1330; --bg-deep: #0A0D24; --card: #181D45; --card-2: #1F2554; --input: #12163A;
  --line: rgba(255,255,255,0.07); --grid: rgba(255,255,255,0.06);
  --fg: #FFFFFF; --fg-2: #B4B9DA; --muted: #7C82AD;
  --magenta: #E040FB; --violet: #7C4DFF; --cyan: #00E5FF; --blue: #2979FF; --sky: #4FC3F7;
  --ok: #00E5A0; --warn: #FFB547; --bad: #FF4D6D;
  --grad-m: linear-gradient(135deg, #E040FB 0%, #7C4DFF 100%);
  --grad-c: linear-gradient(135deg, #00E5FF 0%, #2979FF 100%);
  --display: 'Kanit', 'Sarabun', system-ui, sans-serif;
  --body: 'Sarabun', 'Kanit', system-ui, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
body {
  background: radial-gradient(1100px 520px at 8% -8%, rgba(124,77,255,0.20), transparent 60%), var(--bg);
  background-attachment: fixed; color: var(--fg-2); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px; min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-deep); }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); color: var(--fg); margin: 0; font-weight: 500; text-wrap: balance; }
h1 { font-size: clamp(22px, 3vw, 30px); letter-spacing: -0.3px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
a { color: var(--cyan); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* header */
.head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(0,229,255,0.08);
  border: 1px solid rgba(0,229,255,0.25); color: var(--cyan); font-size: 12.5px; white-space: nowrap; }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }

/* filters */
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); padding: 12px 14px; border-radius: var(--r);
  background: rgba(10,13,36,0.88); backdrop-filter: blur(10px); border: 1px solid var(--line); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
select, input[type=number] { width: 100%; background: var(--input); color: var(--fg); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; }
select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--magenta); outline-offset: 2px; }

/* tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tab { flex: 0 0 auto; background: transparent; border: 0; color: var(--muted); font: 500 14.5px var(--display);
  padding: 10px 16px; border-radius: 10px 10px 0 0; cursor: pointer; position: relative; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); background: rgba(224,64,251,0.12); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px; background: var(--grad-m); }
.panel { display: grid; gap: 16px; }

/* cards */
.kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.kpi { border-radius: var(--r); padding: 18px 20px; color: #fff; min-width: 0; }
.kpi.m { background: var(--grad-m); box-shadow: 0 8px 28px rgba(224,64,251,0.35); }
.kpi.c { background: var(--grad-c); box-shadow: 0 8px 28px rgba(0,229,255,0.28); }
.kpi.p { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--cyan); }
.kpi .l { font-size: 13px; opacity: .92; }
.kpi .v { font: 600 clamp(24px, 2.6vw, 32px)/1.2 var(--display); margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .v small { font: 400 14px var(--body); opacity: .85; margin-left: 6px; }
.kpi .d { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: rgba(0,0,0,0.28); font-size: 12px; }
.kpi .d::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fg-2); }
.kpi .d.up::before { background: var(--ok); } .kpi .d.dn::before { background: var(--bad); }
.kpi.p .l { color: var(--muted); }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
@media (max-width: 920px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 10px; min-width: 0;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35); display: grid; gap: 6px; align-content: start; }
.card .sub { font-size: 12.5px; color: var(--muted); }
.chart { width: 100%; min-height: 360px; }
.chart.map { min-height: 520px; }
.note { border-left: 4px solid var(--line); background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
.note b { color: var(--fg); }
.note.warn { border-color: var(--warn); background: rgba(255,181,71,0.09); } .note.warn b { color: var(--warn); }
.note.info { border-color: var(--blue); background: rgba(41,121,255,0.11); } .note.info b { color: var(--sky); }
.note.ok { border-color: var(--ok); background: rgba(0,229,160,0.07); } .note.ok b { color: var(--ok); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row .field { flex: 1 1 180px; }
.stat { font-variant-numeric: tabular-nums; color: var(--fg); }
.calc { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.out { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.out div { background: var(--input); border-radius: 12px; padding: 10px 12px; }
.out span { display: block; font-size: 12px; color: var(--muted); }
.out b { font: 600 19px var(--display); color: var(--fg); font-variant-numeric: tabular-nums; }
.out b.neg { color: var(--bad); } .out b.pos { color: var(--ok); }
.tablewrap { overflow-x: auto; max-height: 420px; border-radius: 12px; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { position: sticky; top: 0; background: var(--input); color: var(--muted); font-weight: 500; }
tr.sel td { background: rgba(224,64,251,0.14); color: var(--fg); }
.sources { display: grid; gap: 6px; font-size: 13px; }
.sources li { margin-left: 18px; }
footer { font-size: 12.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.seg { display: inline-flex; background: var(--input); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; color: var(--muted); font: 500 13px var(--body); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--grad-m); color: #fff; }
.empty { display: grid; gap: 6px; place-items: start; padding: 18px; border: 1px dashed rgba(255,255,255,0.14); border-radius: 12px; background: rgba(255,255,255,0.02); }
.empty b { color: var(--fg); font-family: var(--display); font-weight: 500; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; background: rgba(255,181,71,0.12); color: var(--warn); }
.chip.ok { background: rgba(0,229,160,0.1); color: var(--ok); }
.kpi .d2 { display: block; margin-top: 4px; font-size: 12px; opacity: .9; font-variant-numeric: tabular-nums; }
.stats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.stats div { background: var(--input); border-radius: 10px; padding: 8px 10px; }
.stats span { display: block; font-size: 11.5px; color: var(--muted); }
.stats b { font: 600 17px var(--display); color: var(--fg); font-variant-numeric: tabular-nums; }
th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--fg); }
th.sort[aria-sort="ascending"]::after { content: " ▲"; } th.sort[aria-sort="descending"]::after { content: " ▼"; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tools input[type=search] { flex: 1 1 220px; background: var(--input); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: inherit; }
.btn { background: var(--grad-m); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; font: 500 14px var(--body); cursor: pointer; box-shadow: 0 6px 20px rgba(224,64,251,0.3); }
.btn.ghost { background: transparent; border: 1px solid var(--line); box-shadow: none; color: var(--fg-2); }
.formula { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: var(--input); border-radius: 10px; padding: 10px 12px; color: var(--fg-2); line-height: 1.8; overflow-x: auto; }
.ref { display: grid; gap: 8px; }
.ref div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; font-size: 13.5px; }
.ref b { color: var(--fg); font-variant-numeric: tabular-nums; text-align: right; }
</style>
